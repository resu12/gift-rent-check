name: Background price monitoring

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-price-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    if: >-
      github.repository == 'resu12/gift-rent-check' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.BACKGROUND_MONITORING_ENABLED == 'true'
    environment: price-monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run bounded owner monitoring
        working-directory: serverless
        env:
          BACKGROUND_MONITORING_ENABLED: ${{ vars.BACKGROUND_MONITORING_ENABLED }}
          BACKGROUND_MONITORING_MANUAL_RETRY: ${{ github.event_name == 'workflow_dispatch' }}
          TGCLOUD_APP_ID: ${{ vars.TGCLOUD_APP_ID }}
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: node tools/run-background-monitoring.mjs --app-id "$TGCLOUD_APP_ID"
