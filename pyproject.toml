[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketapp-rent"
version = "0.1.0"
description = "Gift Rent Check: read-only TON gift discovery and rental price comparisons"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "python-dotenv>=1.0,<2", "pytoniq-core==0.2.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
marketapp-rent = "marketapp_rent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marketapp_rent = ["dashboard_static/*", "dashboard_static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
